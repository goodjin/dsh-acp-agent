                - id: "gpt-6-sol[high]"
                  name: "6 Sol (high)"
                  description: "Previous generation workhorse model. Greater reasoning depth for complex problems"
                - id: "gpt-6-sol[xhigh]"
                  name: "6 Sol (xhigh)"
                  description: "Previous generation workhorse model. Extra high reasoning depth for complex problems"
                - id: "gpt-6-sol[max]"
                  name: "6 Sol (max)"
